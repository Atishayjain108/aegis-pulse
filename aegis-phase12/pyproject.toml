[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-security"
version = "0.1.0"
description = "AEGIS Pulse — Phase 12: Security & Secrets Layer"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # ── Pydantic / settings ──────────────────────────────────────────────────
    "pydantic>=2.7.1,<3.0.0",           # rationale: v2 frozen models, fast validation
    "pydantic-settings>=2.3.0,<3.0.0",  # rationale: env-var config loading

    # ── HTTP client (async) ──────────────────────────────────────────────────
    "httpx[http2]>=0.27.0,<1.0.0",      # rationale: async Vault HTTP calls + H2 support

    # ── Cryptography ─────────────────────────────────────────────────────────
    "cryptography>=42.0.8,<45.0.0",     # rationale: Ed25519, Fernet, X.509 parsing; root pins 43.0.1
    "PyJWT>=2.8.0,<3.0.0",             # rationale: JWT issue/verify (HS256/RS256)

    # ── FastAPI / Starlette ──────────────────────────────────────────────────
    "fastapi>=0.115.0,<1.0.0",          # rationale: async API framework for all services
    "starlette>=0.41.0,<1.0.0",         # rationale: middleware base classes

    # ── Structured logging ────────────────────────────────────────────────────
    "structlog>=24.2.0,<25.0.0",        # rationale: consistent JSON logs across AEGIS

    # ── Optional runtime deps (heavy; gated behind extras) ───────────────────
    # spaCy loaded via importlib at runtime; not a hard dep
]

[project.optional-dependencies]
spacy = [
    "spacy>=3.7.5,<4.0.0",             # rationale: NER-based PII detection (PERSON entities)
    # Model: python -m spacy download en_core_web_sm
]
minio = [
    "aiobotocore>=2.13.0,<3.0.0",      # rationale: async MinIO/S3 audit log archival
]
redis = [
    "redis[hiredis]>=5.0.4,<6.0.0",    # rationale: rate-limit token buckets + JWT revocation
]
dev = [
    # Testing
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.7,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",            # for TestClient
    # Code quality
    "ruff>=0.4.7,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    # Security scanning
    "bandit>=1.7.9,<2.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
]
all = [
    "aegis-security[spacy,minio,redis,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

# ── pytest ────────────────────────────────────────────────────────────────── #
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::DeprecationWarning:pkg_resources",
]
addopts = [
    "--tb=short",
    "-q",
]

# ── Coverage ──────────────────────────────────────────────────────────────── #
[tool.coverage.run]
source = ["src/aegis/security"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ── Ruff ─────────────────────────────────────────────────────────────────── #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # flake8-simplify
    "DTZ", # flake8-datetimez (enforce tz-aware datetimes)
    "ANN", # flake8-annotations (enforce type hints)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # assert statements (used in tests)
    "ANN101","ANN102",  # self/cls annotations
    "ANN201","ANN202",  # missing return type in test helpers
    "S603",  # subprocess without shell=True is fine
    "S607",  # partial executable path (mkcert, sops, age-keygen)
    "B008",  # FastAPI Depends() in function defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "SIM117"]

# ── mypy ──────────────────────────────────────────────────────────────────── #
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["spacy.*", "aiobotocore.*", "jwt.*"]
ignore_missing_imports = true

# ── Bandit ────────────────────────────────────────────────────────────────── #
[tool.bandit]
targets = ["src"]
skips = ["B101", "B603", "B607"]  # assert, subprocess (gated), partial path
