# =============================================================================
# AEGIS PULSE OMEGA v2 — /etc/wsl.conf template
# -----------------------------------------------------------------------------
# Installed to /etc/wsl.conf inside Ubuntu by bootstrap/wsl/01_system.sh.
# Requires `wsl --shutdown` from Windows afterward for changes to take effect.
# =============================================================================

[boot]
# Enable systemd — required for snap, Docker rootless, journald, timers,
# and several services we depend on (chrony, Ollama unit file, etc.).
# Added in WSL 0.67.6 (Windows 11). Must be on to run `systemctl` here.
systemd=true

# Commands to run at every WSL startup (before user login).
# - Resync hardware clock (WSL drifts after host sleep; breaks TLS handshakes).
# - Ensure /tmp is clean.
command = "/bin/sh -c 'hwclock -s || true; rm -rf /tmp/.X* || true'"

[automount]
# Mount Windows drives at /mnt/<drive> with sane defaults.
enabled = true
# metadata → supports chmod/chown on /mnt/c (needed by some tools).
# umask/fmask → avoid the "everything is 777" default.
options = "metadata,umask=22,fmask=11,case=off"
mountFsTab = true

[network]
# Generate /etc/hosts on every boot using Windows hosts file. Keep OFF so
# our custom /etc/hosts entries (e.g. for mkcert-generated local TLS names)
# are not clobbered.
generateHosts = false

# Generate /etc/resolv.conf from Windows. We disable this and let
# systemd-resolved manage DNS — far more reliable than the default,
# which drops DNS entirely after some Windows network changes.
generateResolvConf = false

# Share Windows hostname (useful for license servers, SSO).
hostname = aegis-pulse

[interop]
# Allow launching Windows executables from inside WSL (needed for VS Code,
# `explorer.exe .`, browser launching for OAuth flows, etc.).
enabled = true
# Don't append Windows PATH — prevents accidental invocation of Windows
# Python / Node shims that break virtualenv activation.
appendWindowsPath = false

[user]
# First-run user is autodetected by WSL; do not override unless you know
# what you're doing. Listed here for discoverability.
# default = aegis

[filesystem]
# Default umask for the VFS. 0022 → files 644, dirs 755.
umask = 0022
