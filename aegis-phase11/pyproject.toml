[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-llm"
version = "11.0.0"
description = "AEGIS Pulse — Phase 11: Local LLM Orchestration Layer"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "AEGIS Engineering" }]

# ---------------------------------------------------------------------------
# Core dependencies — pinned to exact versions compatible with Python 3.12
# as of Q2 2026. Rationale comments explain each dependency.
# ---------------------------------------------------------------------------
dependencies = [
    # HTTP client — async, HTTP/2, used by all provider adapters
    "httpx[http2]==0.27.2",
    # Pydantic v2 — frozen models, settings, typed outputs
    "pydantic==2.9.2",
    # Pydantic settings — env var loading with prefix support
    "pydantic-settings==2.5.2",
    # Structured logging — JSON in prod, coloured in TTY
    "structlog==24.4.0",
    # Jinja2 — prompt template rendering
    "Jinja2==3.1.4",
    # Click — CLI commands (aegis llm *)
    "click==8.1.7",
]

[project.optional-dependencies]
# sentence-transformers — CPU fallback embedding when Ollama is offline
embed = [
    "sentence-transformers==3.3.1",     # BGE-M3 local embedding
    "torch==2.4.1",                      # PyTorch CPU; for GPU use cu124 variant
]

# Full dev toolchain
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-benchmark==4.0.0",
    "mypy==1.11.2",
    "ruff==0.7.1",
    "hypothesis==6.115.3",
]

[project.entry-points."aegis.commands"]
llm = "aegis.llm.cli.commands:llm_group"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::DeprecationWarning:httpx",
]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/aegis/llm"]
omit = ["*/tests/*", "*/eval/golden/*"]
branch = true

[tool.coverage.report]
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "DTZ",       # datetime timezone awareness
    "S",         # flake8-bandit (security)
    "RUF",       # ruff-specific rules
    "ANN",       # annotations
    "PLW",       # pylint warnings
    "BLE",       # blind exception catches
    "SIM",       # simplify
]
ignore = [
    "S101",      # assert statements (OK in tests)
    "ANN401",    # Dynamically typed expressions (Any) — used intentionally
    "ANN002",    # Missing type annotation for *args
    "ANN003",    # Missing type annotation for **kwargs
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "BLE001", "PLW"]
"src/aegis/llm/cli/**/*.py" = ["ANN"]
