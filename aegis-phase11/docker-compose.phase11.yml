# =============================================================================
# docker-compose.phase11.yml — Phase 11 LLM services overlay
# =============================================================================
#
# Merge this with the main docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.phase11.yml up -d
#
# Or add to the main file's `include:` block (Compose v2.20+).
#
# Services added:
#   aegis-ollama    — Local Ollama inference server (primary LLM path)
#   aegis-vllm      — vLLM GPU inference server (optional, requires NVIDIA)
#   aegis-litellm   — LiteLLM proxy (OpenAI-compat gateway over all providers)
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # Ollama — local inference server
  # FREE-TIER PATH: zero cost, fully private, no internet required
  # ---------------------------------------------------------------------------
  aegis-ollama:
    image: ollama/ollama:0.4.7
    container_name: aegis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - aegis_ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "*"
      # Increase context window beyond the 2048 default
      OLLAMA_NUM_CTX: "32768"
      # Max loaded models in memory (reduce if RAM < 16GB)
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # GPU passthrough — comment out if no NVIDIA GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aegis-internal

  # ---------------------------------------------------------------------------
  # vLLM — high-throughput GPU inference (optional)
  # Requires: NVIDIA GPU with 8GB+ VRAM, nvidia-container-toolkit
  # ---------------------------------------------------------------------------
  aegis-vllm:
    image: vllm/vllm-openai:v0.6.6
    container_name: aegis-vllm
    restart: unless-stopped
    profiles: ["gpu"]  # Only started with: docker compose --profile gpu up
    ports:
      - "8001:8000"
    volumes:
      - aegis_vllm_models:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    command: >
      --model Qwen/Qwen2.5-14B-Instruct
      --dtype auto
      --max-model-len 32768
      --tensor-parallel-size 1
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s  # Model loading takes time
    networks:
      - aegis-internal

  # ---------------------------------------------------------------------------
  # LiteLLM — OpenAI-compatible proxy over all providers
  # Allows external tools (LangChain, Flowise) to use AEGIS's provider pool
  # ---------------------------------------------------------------------------
  aegis-litellm:
    image: ghcr.io/berriai/litellm:main-v1.52.9
    container_name: aegis-litellm
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8080", "--detailed_debug"]
    environment:
      # Provider keys — read from host environment (never hardcoded)
      AEGIS_OLLAMA_BASE_URL: "${AEGIS_OLLAMA_BASE_URL:-http://aegis-ollama:11434}"
      AEGIS_VLLM_BASE_URL: "${AEGIS_VLLM_BASE_URL:-http://aegis-vllm:8000}"
      AEGIS_GROQ_API_KEY: "${AEGIS_GROQ_API_KEY:-}"
      AEGIS_OPENROUTER_API_KEY: "${AEGIS_OPENROUTER_API_KEY:-}"
      AEGIS_GEMINI_API_KEY: "${AEGIS_GEMINI_API_KEY:-}"
      AEGIS_LITELLM_MASTER_KEY: "${AEGIS_LITELLM_MASTER_KEY:-sk-litellm-dev-key-not-for-prod}"
      # DB for call logging (optional)
      AEGIS_PG_DSN: "${AEGIS_PG_DSN:-}"
    depends_on:
      aegis-ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aegis-internal

  # ---------------------------------------------------------------------------
  # Ollama model bootstrap (one-shot init container)
  # Pulls required models on first start, then exits
  # ---------------------------------------------------------------------------
  aegis-ollama-init:
    image: curlimages/curl:8.10.1
    container_name: aegis-ollama-init
    restart: "no"
    depends_on:
      aegis-ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Pulling bge-m3 (embedding model)...' &&
        curl -sf -X POST http://aegis-ollama:11434/api/pull -d '{\"name\":\"bge-m3\"}' &&
        echo 'Pulling llama3.2:3b (fast model)...' &&
        curl -sf -X POST http://aegis-ollama:11434/api/pull -d '{\"name\":\"llama3.2:3b\"}' &&
        echo 'Model bootstrap complete.'
      "
    networks:
      - aegis-internal

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  aegis_ollama_models:
    driver: local
  aegis_vllm_models:
    driver: local

# ---------------------------------------------------------------------------
# Networks (reference existing network from main compose)
# ---------------------------------------------------------------------------
networks:
  aegis-internal:
    external: true
    name: aegis_aegis-internal
