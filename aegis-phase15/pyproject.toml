[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aegis-dr"
version = "0.15.0"
description = "AEGIS Pulse Phase 15 — Disaster Recovery & Business Continuity"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core aegis deps (already in root pyproject.toml — listed here for standalone use)
    "pydantic>=2.11,<3",           # rationale: frozen models, model_validate_json
    "pydantic-settings>=2.3,<3",  # rationale: AEGIS_DR_* env var loading
    "structlog>=24.1,<25",        # rationale: structured logging, AEGIS-wide standard
    "click>=8.1,<9",              # rationale: CLI group registered in aegis.cli
    "httpx>=0.27,<1",             # rationale: ntfy alert delivery, async HTTP client
    "minio>=7.2,<8",              # rationale: MinIO backup/restore object operations
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.14,<4",
    "coverage[toml]>=7.5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::ResourceWarning"]

[tool.coverage.run]
source = ["src/aegis/dr"]
branch = true

[tool.coverage.report]
fail_under = 78
show_missing = true
