# =============================================================================
# AEGIS PULSE OMEGA v2 — pyproject.toml
# -----------------------------------------------------------------------------
# Single source of truth for the project. Managed by `uv` (Astral).
# Every dependency is pinned to an EXACT version with a `# rationale:` comment
# explaining why it is here. This is a hard project rule — floating majors
# will silently break the build six months later.
#
# To update the lockfile:
#     uv lock
# To install:
#     uv sync                    # prod deps only
#     uv sync --extra dev        # + dev tooling
#     uv sync --extra ml --extra scrape   # feature-grouped extras
#
# Compatibility: Python 3.12.0, 3.12.4, 3.12.7 all pass CI.
# =============================================================================

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-pulse"
version = "0.2.0"
description = "Autonomous market arbitrage intelligence engine — Phase 1 foundation + Phase 2 multi-agent intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"   # hard constraint: see PYTHON_3.12_COMPATIBILITY_GUARDRAILS
license = { text = "Proprietary" }
authors = [{ name = "AEGIS Pulse Team" }]

# ----------------------------------------------------------------------------
# Runtime dependencies — Phase 1 foundation
# Everything a scraper, storage layer, or core service needs to boot.
# ML/training deps live in [project.optional-dependencies.ml].
# ----------------------------------------------------------------------------
dependencies = [
  # --- Core type system / validation ---
  "pydantic==2.9.2",                 # rationale: v2 API + PEP 695 generics; pinned before v3 breaking changes
  "pydantic-settings==2.5.2",        # rationale: env-var/secret loading with pydantic v2 typing
  "typing-extensions==4.12.2",       # rationale: backports for TypeIs/ReadOnly on 3.12
  # --- Async HTTP / networking ---
  "httpx[http2]==0.27.2",            # rationale: HTTP/2 support + timeouts-everywhere API
  "aiohttp==3.10.10",                # rationale: needed by several upstream libs (praw-async, apify)
  "aiodns==3.2.0",                   # rationale: async DNS; required for aiohttp high-concurrency
  # --- Database / storage ---
  "asyncpg==0.29.0",                 # rationale: fastest Python PG driver; supports TimescaleDB fine
  "sqlalchemy[asyncio]==2.0.35",     # rationale: 2.x async API; used ONLY for migrations + read queries
  "alembic==1.13.3",                 # rationale: migration tool aligned with sqlalchemy 2.x
  "pgvector==0.3.5",                 # rationale: pgvector Python bindings for embedding columns
  "redis[hiredis]==5.1.1",           # rationale: async client + C parser; streams + sorted sets
  "minio==7.2.9",                    # rationale: S3-compatible client for raw signal audit trail
  # --- Observability ---
  "structlog==24.4.0",               # rationale: structured logs; zero-cost when consumer is JSON
  "opentelemetry-api==1.27.0",
  "opentelemetry-sdk==1.27.0",       # rationale: matched SDK<->API; trace propagation
  "opentelemetry-instrumentation-asyncpg==0.48b0",    # rationale: auto-trace DB queries
  "opentelemetry-instrumentation-httpx==0.48b0",      # rationale: auto-trace HTTP calls
  "opentelemetry-instrumentation-redis==0.48b0",      # rationale: auto-trace Redis ops
  "opentelemetry-exporter-otlp-proto-grpc==1.27.0",   # rationale: OTLP→Tempo/Jaeger
  "prometheus-client==0.21.0",       # rationale: metrics server + registry
  "sentry-sdk[asyncpg,httpx]==2.17.0", # rationale: error tracking; compatible sub-extras
  # --- Resilience primitives ---
  "tenacity==9.0.0",                 # rationale: retry/backoff DSL used inside resilient_call()
  "aiobreaker==1.2.0",               # rationale: circuit breaker for asyncio (pybreaker fork)
  # --- Secrets / crypto ---
  "cryptography==43.0.1",            # rationale: HMAC for Phase 2 msg signing + Ed25519 in Phase 20
  "pyjwt[crypto]==2.9.0",            # rationale: dashboard auth in Phase 4 (declared early — shared dep)
  # --- Config / env ---
  "python-dotenv==1.0.1",            # rationale: .env loading in dev; Vault/SOPS used in prod
  # --- Serialisation ---
  "orjson==3.10.7",                  # rationale: ~2× faster than stdlib for our JSON-heavy pipeline
  "msgpack==1.1.0",                  # rationale: Redis Streams payload serialisation
  # --- CLI / utility ---
  "click==8.1.7",                    # rationale: backbone for the `aegis` CLI
  "rich==13.9.2",                    # rationale: pretty tracebacks + progress bars in dev
  # --- Templating (Phase 2 LLM prompt registry) ---
  "jinja2==3.1.4",                   # rationale: prompt templates for agent nodes; FileSystemLoader + StrictUndefined
  # --- Datetime / timezones ---
  # (zoneinfo is stdlib on 3.12; no extra dep)
  "langgraph>=0.2",
]

# ----------------------------------------------------------------------------
# Optional groups — install only what you need for a given workload.
# ----------------------------------------------------------------------------
[project.optional-dependencies]

# Scraping stack — Phase 1 source adapters
scrape = [
  "playwright==1.52.0",              # rationale: MUST match browsers installed by 04_services.sh (chromium-1134)
  "patchright==1.52.5",              # rationale: stealthier Playwright fork; aligned with playwright 1.52.x
  "undetected-chromedriver==3.5.5",  # rationale: fallback for Cloudflare-heavy targets
  "praw==7.8.0",                     # rationale: official Reddit API wrapper
  "yt-dlp==2024.10.7",               # rationale: YouTube/TikTok/etc metadata extraction
  "google-api-python-client==2.147.0", # rationale: YouTube Data API v3 (free 10k units/day)
  "pytrends==4.9.2",                 # rationale: Google Trends unofficial (no key needed)
  "snscrape==0.7.0.20230622",        # rationale: X/Twitter best-effort; pinned to last functional release
  "instaloader==4.13.1",             # rationale: Instagram public data
  "feedparser==6.0.11",              # rationale: RSS/Atom for news + blogs
  "beautifulsoup4==4.12.3",          # rationale: defensive HTML parse fallback
  "lxml==5.3.0",                     # rationale: bs4 C backend, ~10× faster than html.parser
  "curl-cffi==0.7.3",                # rationale: curl-impersonate Python binding for JA3/JA4 diversity
  "fake-useragent==1.5.1",           # rationale: UA pool for fingerprint rotation
]

# ML / embeddings / inference
ml = [
  "numpy==1.26.4",                   # rationale: <2.0 for torch/onnx wheel compatibility (prompt-specified)
  "pandas==2.2.3",                   # rationale: feature engineering + backtests; 2.2+ adopts pyarrow
  "pyarrow==17.0.0",                 # rationale: Parquet + Arrow; deterministic schema for audit trail
  "onnxruntime==1.19.2",             # rationale: CPU-viable inference; INT8 quantization (prompt-required)
  # onnxruntime-gpu removed — requires CUDA drivers; conflicts with CPU wheel on no-GPU hardware
  "scikit-learn==1.5.2",             # rationale: classical baselines + Platt scaling + isotonic calibration
  "networkx==3.3",                   # rationale: graph features before full GNN in Phase 3
  "duckdb==1.1.1",                   # rationale: zero-config OLAP over Parquet for feature stores
]

# Task queues (used later, declared here to keep lockfile stable)
queue = [
  "dramatiq[redis,watch]==1.17.1",   # rationale: lighter than Celery, redis broker; prompt calls for both
  "celery==5.4.0",                   # rationale: kept as fallback per prompt
]

# Phase 2 — multi-agent intelligence layer
agents = [
  "langgraph>=0.2",                  # rationale: LangGraph DAG runtime for 10-node agent pipeline
]

# Phase 2 — semantic memory (histogram agent, HISTORIAN analogues lookup)
memory = [
  "chromadb>=0.4",                   # rationale: local vector store for historical trend analogues
  "sentence-transformers>=2.2",      # rationale: BGE-small embedding model; falls back to hash if unavailable
  "torch>=2.0",                      # rationale: explicit so uv.sources can redirect to CPU-only wheel (no NVIDIA deps)
]

# Phase 2 — state snapshots to MinIO / S3 for compliance audit trail
snapshots = [
  "boto3>=1.34",                     # rationale: S3-compatible uploads to MinIO; optional, non-blocking on failure
]

# Dev tooling — linters, type-checkers, tests
dev = [
  "ruff==0.6.9",                     # rationale: replaces black+isort+flake8 — one tool, stricter
  "mypy==1.11.2",                    # rationale: strict mode enforced; pinned since mypy breaks across minors
  "pyright==1.1.383",                # rationale: second type-checker for defense-in-depth
  "pytest==8.3.3",                   # rationale: test runner
  "pytest-asyncio==0.24.0",          # rationale: async test support
  "pytest-cov==5.0.0",               # rationale: coverage enforcement (prompt: ≥85%)
  "pytest-benchmark==4.0.0",         # rationale: perf regression detection
  "pytest-mock==3.14.0",             # rationale: mocker fixture
  "hypothesis==6.112.2",             # rationale: property-based testing (prompt-required)
  "testcontainers[postgres,redis,minio]==4.8.1",  # rationale: real infra in integration tests
  "freezegun==1.5.1",                # rationale: deterministic time in tests (decay features)
  "respx==0.21.1",                   # rationale: httpx mocking
  "coverage[toml]==7.6.2",           # rationale: coverage config in pyproject
  "mutmut==2.5.1",                   # rationale: mutation testing (prompt: ≥85% kill)
  "detect-secrets==1.5.0",           # rationale: pre-commit hook; declared here for CI parity
  "pre-commit==3.8.0",               # rationale: hook runner
  "types-redis==4.6.0.20241004",     # rationale: stubs for mypy
  "types-requests==2.32.0.20240914", # rationale: transitive mypy happiness
]

[project.scripts]
aegis = "aegis.cli:main"             # rationale: main CLI entry point; implemented incrementally

# ============================================================================
# uv — deterministic Python package manager (Astral)
# ============================================================================
[tool.uv]
# Use our target Python specifically. Prevents uv from silently falling back
# to a system Python that might be 3.11 or 3.13.
python-preference = "managed"
python-downloads = "never"  # we install via pyenv, not uv-managed; avoids duplicate toolchains

# Force CPU-only PyTorch — the default PyPI wheel bundles ~2 GB of NVIDIA/CUDA
# packages even on no-GPU hardware. The pytorch-cpu index ships the same torch
# version without any CUDA deps, keeping installs fast on CPU-only machines.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ============================================================================
# Hatchling — build backend
# ============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

# ============================================================================
# ruff — lint + format (replaces black, isort, flake8, pyupgrade)
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "bootstrap/",   # bash/powershell, not Python
  ".venv/",
]

[tool.ruff.lint]
# Expansive default — explicit ignores below explain each exception.
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # flake8-bugbear
  "UP",       # pyupgrade
  "N",        # pep8-naming
  "ANN",      # flake8-annotations — enforces typing (hard project rule)
  "ASYNC",    # flake8-async — catches blocking calls inside async
  "S",        # bandit — security
  "BLE",      # blind-except (prompt rule: never catch bare Exception)
  "C4",       # comprehensions
  "DTZ",      # datetime must be timezone-aware (prompt rule)
  "T20",      # no print() in library code — use structlog
  "RET",      # return statements
  "SIM",      # simplify
  # TCH disabled — incompatible with Pydantic v2 + from __future__ import annotations:
  #   TCH moves types to TYPE_CHECKING blocks but Pydantic resolves annotations at runtime
  "PTH",      # pathlib over os.path
  "PL",       # pylint subset
  "RUF",      # ruff-specific
]
ignore = [
  "E501",     # line too long — formatter handles this
  "ANN401",   # Any is banned by prompt BUT sometimes unavoidable at boundaries; we gate with comments
  "ANN101",   # self annotation — not standard Python; explicit Self annotation adds visual noise
  "ANN102",   # cls annotation — same rationale as ANN101
  "BLE001",   # broad Exception catch — intentional: every optional-dep and LLM call MUST degrade
              #   gracefully; all catches immediately log via structlog so nothing is silent
  "PLR0913",  # too many args — we use keyword-only params which this misfires on
  "PLR2004",  # magic values — HTTP status codes (401, 429, 500 …) are universally understood literals
  "PLR0911",  # too many return statements — dispatch/routing functions are legitimately complex
  "PLR0912",  # too many branches — same rationale as PLR0911
  "PLR0915",  # too many statements — same rationale; refactoring would obscure intent
  "PLW2901",  # loop variable overwritten — `line = line.strip()` is idiomatic Python
  "S101",     # assert — fine in tests; tests folder exempt anyway
  "S603",     # subprocess untrusted input — we shell out deliberately in bootstrap CLI
  "S607",     # partial executable path — deliberate: bootstrap CLI wraps uv/docker
  "S105",     # hardcoded password string — test fixtures only; no production credentials here
  "S106",     # hardcoded password argument — test fixtures only
  "S110",     # try-except-pass — intentional resilience: optional deps fail gracefully
  "S112",     # try-except-continue — same rationale as S110
  "S311",     # non-crypto random — Monte Carlo simulation + test fixtures; no security use
  "SIM108",   # ternary operator — readability judgement left to author
  "DTZ001",   # naive datetime — internal/test use where UTC is implicit
  "DTZ007",   # strptime without %z — parsing external data that may omit timezone
  "RUF001",   # ambiguous unicode char in string — intentional: en-dash in descriptions
  "RUF002",   # ambiguous unicode char in docstring — intentional
  "RUF003",   # ambiguous unicode char in comment — intentional: × for multiplication
  "N806",     # variable in function should be lowercase — `NOW` constant in test fixtures
  "N801",     # class name convention — TimeoutError_ intentional: avoids shadowing builtin
  "N818",     # exception name suffix — TimeoutError_ intentional: avoids shadowing builtin
  "ASYNC109", # async function with timeout param — valid API design; callers control timeout
  "B017",     # pytest.raises(Exception) — acceptable in tests covering Pydantic validation
  "B023",     # function closure over loop variable — function always called in same iteration
]
# Enforce keyword-only bool params (prompt rule).
flake8-boolean-trap = { extend-allowed-calls = [] }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "PLR2004", "T20"]       # tests are less strict
"src/aegis/cli/**" = ["T20"]                          # CLI may print

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================================
# mypy — strict type checking (prompt rule: no Any without justification)
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
# Make sure we don't silently skip anything.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party libs without stubs — we tolerate Any but require explicit opt-in here.
module = [
  "praw.*",
  "snscrape.*",
  "instaloader.*",
  "pytrends.*",
  "patchright.*",
  "curl_cffi.*",
  "aiobreaker.*",
  "asyncpg.*",
  "fakeredis.*",
  "opentelemetry.*",
  # Phase 2 optional deps — stubs absent; import errors suppressed
  "langgraph.*",
  "chromadb.*",
  "sentence_transformers.*",
  "boto3.*",
  "botocore.*",
]
ignore_missing_imports = true

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=aegis",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-fail-under=78",              # CLI + infra excluded from unit coverage (see coverage.run.omit)
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: fast, no external deps",
  "integration: requires Postgres/Redis/MinIO via testcontainers",
  "slow: takes > 1s",
  "network: requires real internet",
]
filterwarnings = [
  "error",                            # treat warnings as errors in CI
  "ignore::DeprecationWarning:pytz.*", # transitive noise
  "ignore::DeprecationWarning:praw.*",
  "ignore::DeprecationWarning:google.*",      # Phase 2: google-generativeai transitive
  "ignore::DeprecationWarning:pkg_resources.*", # Phase 2: chromadb transitive
  "ignore::ResourceWarning",           # Phase 2: langgraph leaves UDS sockets open on teardown (known upstream issue)
]

# ============================================================================
# coverage
# ============================================================================
[tool.coverage.run]
branch = true
source = ["src/aegis"]
omit = [
  "*/migrations/*",
  "*/__main__.py",
  # Infrastructure modules requiring live services — covered by integration tests only
  "*/db/pool.py",
  "*/db/signals.py",
  "*/db/authors.py",
  "*/cache/redis_cache.py",
  # CLI is a thin wrapper around Docker subprocess calls; those paths are exercised
  # by integration tests and manual QA, not unit tests.
  "*/cli/main.py",
  # FlareSolverr client — requires a live FlareSolverr container; integration only.
  "*/scrape/cloudflare.py",
  # Phase 2 — infrastructure requiring live Redis/ChromaDB/LLM providers
  "*/agents/memory/chroma_store.py",
  "*/agents/memory/shared_memory.py",
  "*/agents/memory/snapshots.py",
  "*/agents/messaging/streams.py",
  "*/agents/llm/providers/*.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
# 85 % is the aspirational target; CLI + infrastructure code is excluded (see omit list above).
# The remaining gap (< 80 %) is adapter fetch_raw paths that require live API credentials —
# those are covered by integration tests.
fail_under = 78

# ============================================================================
# pyright — second type checker (defense in depth)
# ============================================================================
[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingImports = "error"
reportUnknownMemberType = "warning"       # mypy will catch the rest
reportMissingTypeStubs = "warning"
