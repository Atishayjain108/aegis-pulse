name: ci

# Fast quality gate (audit P0-1): ruff + the unit suite + Phase 4 suite on every
# push/PR. This is the lane that was missing — the integration.yml header
# referenced a "default ci workflow" that did not exist, so nothing ran ruff or
# the 2,800-test unit suite automatically and a red suite shipped for ~8 days.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AEGIS_ENV: test
      AEGIS_DISABLE_OLLAMA: "1"
      AEGIS_AGENT_HMAC_KEY: test-key-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (all workspace members + extras)
        run: uv sync --all-packages --all-extras

      - name: Ruff (lint gate — must be zero violations)
        run: uv run ruff check .

      - name: Unit suite + coverage floor (78%)
        run: >-
          uv run python -m pytest tests/unit/ -q -p no:hypothesis

      - name: Phase 4 (execute) unit suite
        run: >-
          uv run python -m pytest aegis-phase4/tests/ -q -p no:hypothesis --no-cov

      - name: Security fixtures (prompt injection)
        run: >-
          uv run python -m pytest tests/security/ -q -p no:hypothesis --no-cov

  # Image-level import smoke test (2026-07-03..15 ingestion blackout).
  # The autonomous scheduler ran scrape adapters on an image that installed
  # only the [predict] extra: 20 scrape modules were unimportable INSIDE the
  # container (defusedxml ×6, feedparser ×14) while every host-venv test was
  # green. This job builds the real autonomous image; the Dockerfile runs
  # scripts/smoke_import_scrape.py as a build step, so any ImportError inside
  # the image fails this build. Host state is irrelevant here by design.
  autonomous-image-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build autonomous image (in-image import walk gates the build)
        run: >-
          docker build -f docker/Dockerfile.predict
          --build-arg INSTALL_SCRAPE=1
          -t aegis-autonomous:ci .

      - name: Re-run import walk in the finished image (belt and braces)
        run: >-
          docker run --rm --entrypoint ""
          -e AEGIS_ENV=test
          aegis-autonomous:ci
          python /app/scripts/smoke_import_scrape.py
