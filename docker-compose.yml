# =====================================================================
# AEGIS Pulse — local dev stack
# =====================================================================
# All services in this compose file are wired for the laptop / WSL2
# scenario described in docs/SETUP_FOR_NON_TECHNICAL.md.
#
# Networking model
# ----------------
# Every service exposes its port on `127.0.0.1:<port>`. We deliberately
# do NOT expose to `0.0.0.0` even on a private dev machine — this keeps
# the dev stack invisible to other devices on the LAN.
#
# Volumes
# -------
# Named volumes prefixed `aegis_` survive `docker compose down`. To
# wipe data, run `aegis reset` (which calls `down --volumes`).
#
# Health checks
# -------------
# Every service has a healthcheck so `aegis status` reports something
# meaningful. Probes are tuned for laptop start-up (start_period high
# enough to absorb cold-cache I/O, retries generous).
# =====================================================================

name: aegis-pulse

services:

  # -----------------------------------------------------------------
  # Postgres + TimescaleDB + pgvector
  # The timescale/timescaledb-ha image already bundles pgvector.
  # -----------------------------------------------------------------
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_app_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      # Enable wal_level=logical so replication slots are usable later.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "listen_addresses=*"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aegis_postgres_data:/home/postgres/pgdata/data
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis_app} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Redis (cache + priority queue + Streams)
  # -----------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - aegis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # MinIO (S3-compatible audit/raw bucket)
  # -----------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis-dev-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aegis-dev-secret-please-change}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - aegis_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # FlareSolverr — Cloudflare challenge solver
  # -----------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: aegis-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: UTC
    ports:
      - "127.0.0.1:8191:8191"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 3 — Predict service (FastAPI inference surface)
  # Build: docker build -f docker/Dockerfile.predict -t aegis-predict .
  # Serve: POST /predict  POST /predict/batch  GET /healthz  GET /metrics
  # -----------------------------------------------------------------
  predict:
    build:
      context: .
      dockerfile: docker/Dockerfile.predict
    image: aegis-predict:latest
    container_name: aegis-predict
    restart: unless-stopped
    environment:
      AEGIS_PG_DSN: postgresql://${POSTGRES_USER:-aegis_app}:${POSTGRES_PASSWORD:-aegis_app_dev_pw}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_ENV: ${AEGIS_ENV:-development}
      AEGIS_LOG_JSON: "true"
      AEGIS_FLARESOLVERR_URL: "http://aegis-flaresolverr:8191/v1"
      # Disable Ollama in the predict container — inference is heuristic-first
      AEGIS_DISABLE_OLLAMA: "1"
      # Hard timeout (seconds) per inference request
      PREDICT_HARD_TIMEOUT_S: "30"
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 4 — Execute API (alert engine, killswitch, SSE dashboard)
  # Build: docker build -f aegis-phase4/docker/Dockerfile.api -t aegis-execute-api aegis-phase4/
  # Serve: GET /healthz  GET /readyz  GET /dashboard/  POST /alerts  GET /stream
  # -----------------------------------------------------------------
  execute-api:
    build:
      context: aegis-phase4
      dockerfile: docker/Dockerfile.api
    image: aegis-execute-api:latest
    container_name: aegis-execute-api
    restart: unless-stopped
    environment:
      AEGIS_EXECUTE_MODE: advisory
      AEGIS_EXECUTE_API_HOST: "0.0.0.0"
      AEGIS_EXECUTE_API_PORT: "8200"
      AEGIS_EXECUTE_HMAC_KEY: "dev-hmac-key-not-for-prod"
      AEGIS_EXECUTE_KILLSWITCH_KEY: "aegis:execute:killswitch"
      AEGIS_PG_DSN: postgresql://${POSTGRES_USER:-aegis_app}:${POSTGRES_PASSWORD:-aegis_app_dev_pw}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_FLARESOLVERR_URL: "http://aegis-flaresolverr:8191/v1"
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=2); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 4 — Execute Drain worker (outbox → notification channels)
  # -----------------------------------------------------------------
  execute-drain:
    build:
      context: aegis-phase4
      dockerfile: docker/Dockerfile.drain
    image: aegis-execute-drain:latest
    container_name: aegis-execute-drain
    restart: unless-stopped
    environment:
      # Tenant UUID for this drain worker. Use the same default_tenant_id
      # as the main aegis stack (from AEGIS_DEFAULT_TENANT_ID in .env).
      AEGIS_EXECUTE_TENANT_ID: ${AEGIS_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      AEGIS_EXECUTE_HMAC_KEY: "dev-hmac-key-not-for-prod"
      AEGIS_EXECUTE_KILLSWITCH_KEY: "aegis:execute:killswitch"
      AEGIS_PG_DSN: postgresql://${POSTGRES_USER:-aegis_app}:${POSTGRES_PASSWORD:-aegis_app_dev_pw}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_FLARESOLVERR_URL: "http://aegis-flaresolverr:8191/v1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis

  # -----------------------------------------------------------------
  # AEGIS Command Center Dashboard (unified web UI on :8300)
  # Reads from Postgres + Redis; proxies Phase 3 :8100 + Phase 4 :8200.
  # Start separately: uv run aegis dashboard serve
  # Or via compose: docker compose up dashboard
  # -----------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: aegis-dashboard:latest
    container_name: aegis-dashboard
    restart: unless-stopped
    environment:
      AEGIS_PG_DSN: postgresql://${POSTGRES_USER:-aegis_app}:${POSTGRES_PASSWORD:-aegis_app_dev_pw}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_ENV: ${AEGIS_ENV:-development}
      AEGIS_PREDICT_API_URL: http://predict:8000
      AEGIS_EXECUTE_API_URL: http://execute-api:8200
      AEGIS_FLARESOLVERR_URL: "http://aegis-flaresolverr:8191/v1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      predict:
        condition: service_healthy
      execute-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=2); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Prometheus
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aegis-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aegis_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Grafana
  # -----------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.2
    container_name: aegis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-aegis_dev_admin_pw}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - aegis_grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 30s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Jaeger (all-in-one) for traces. Tempo is heavier; Jaeger is fine
  # for laptop scale.
  # -----------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: aegis-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16687:16686"  # UI
      - "127.0.0.1:4319:4317"    # OTLP gRPC
      - "127.0.0.1:4320:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:14269/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 10 — Prefect 3 orchestration server (optional UI)
  # The lake itself runs as a library inside the main Python process.
  # Prefect is only needed if you want the flow-run UI at :4200.
  # -----------------------------------------------------------------
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: aegis-prefect
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_HOME: /opt/prefect
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_LOGGING_LEVEL: INFO
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - aegis_prefect_data:/opt/prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4200/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 11 — Ollama local inference server (primary LLM path)
  # Zero cost, fully private, no internet required.
  # Models are pulled on first boot by aegis-ollama-init.
  # GPU passthrough commented out — uncomment if NVIDIA GPU is present.
  # -----------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.4.7
    container_name: aegis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - aegis_ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "*"
      OLLAMA_NUM_CTX: "32768"
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 11 — Ollama model bootstrap (one-shot init container)
  # Pulls the embedding model (bge-m3) and fast chat model (llama3.2:3b)
  # on first start. Exits cleanly once done; safe to re-run.
  # Heavy models (qwen2.5:14b) are pulled manually: aegis llm pull qwen2.5:14b
  # -----------------------------------------------------------------
  ollama-init:
    image: curlimages/curl:8.10.1
    container_name: aegis-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '[ollama-init] Pulling bge-m3 embedding model...' &&
        curl -sf -X POST http://aegis-ollama:11434/api/pull
          -H 'Content-Type: application/json'
          -d '{\"name\":\"bge-m3\"}' &&
        echo '[ollama-init] Pulling llama3.2:3b fast chat model...' &&
        curl -sf -X POST http://aegis-ollama:11434/api/pull
          -H 'Content-Type: application/json'
          -d '{\"name\":\"llama3.2:3b\"}' &&
        echo '[ollama-init] Bootstrap complete.'
      "
    networks:
      - aegis

  # -----------------------------------------------------------------
  # Phase 11 — LiteLLM proxy (optional OpenAI-compatible gateway)
  # Exposes all providers behind a single OpenAI-format endpoint.
  # Useful when external tools (LangChain, Flowise) need AEGIS providers.
  # Start separately: docker compose --profile llm-proxy up aegis-litellm
  # -----------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.52.9
    container_name: aegis-litellm
    restart: unless-stopped
    profiles: ["llm-proxy"]
    ports:
      - "8080:8080"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8080"]
    environment:
      AEGIS_OLLAMA_BASE_URL: "http://aegis-ollama:11434"
      AEGIS_GROQ_API_KEY: "${AEGIS_GROQ_API_KEY:-}"
      AEGIS_OPENROUTER_API_KEY: "${AEGIS_OPENROUTER_API_KEY:-}"
      AEGIS_GEMINI_API_KEY: "${AEGIS_GEMINI_API_KEY:-}"
      AEGIS_LITELLM_MASTER_KEY: "${AEGIS_LITELLM_MASTER_KEY:-sk-litellm-dev-key-not-for-prod}"
      AEGIS_PG_DSN: "${AEGIS_PG_DSN:-}"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aegis

# ---------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------
volumes:
  aegis_postgres_data:
    name: aegis_postgres_data
  aegis_redis_data:
    name: aegis_redis_data
  aegis_minio_data:
    name: aegis_minio_data
  aegis_prometheus_data:
    name: aegis_prometheus_data
  aegis_grafana_data:
    name: aegis_grafana_data
  aegis_prefect_data:
    name: aegis_prefect_data
  aegis_ollama_models:
    name: aegis_ollama_models

# ---------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------
networks:
  aegis:
    name: aegis
    driver: bridge
