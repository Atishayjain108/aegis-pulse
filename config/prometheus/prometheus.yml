# Prometheus scrape configuration for the AEGIS Pulse local stack.
#
# Targets:
#   * Prometheus itself (sanity / meta-metrics)
#   * The AEGIS Pulse application's /metrics endpoint
#   * cAdvisor / node-exporter if the user adds them later
#
# Retention is set on the docker-compose command-line (15 days);
# scrape intervals here are conservative to keep laptop load low.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    project: aegis-pulse
    env: local

scrape_configs:
  # ----- Prometheus itself --------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"

  # ----- AEGIS Pulse application -------------------------------------------
  # The app exposes its central CollectorRegistry on the configured
  # AEGIS_PROMETHEUS_PORT.  The default is 8001 (kept distinct from the
  # dashboard on 8000).  When the app runs on the host (not inside compose),
  # use ``host.docker.internal`` so Prometheus running in compose can reach it.
  - job_name: aegis
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"
        labels:
          service: aegis-pulse

  # ----- Optional: cadvisor (uncomment if you add the container) ----------
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]
