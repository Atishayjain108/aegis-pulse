# =============================================================================
# config/litellm_config.yaml — LiteLLM proxy config (Phase 11)
# =============================================================================
#
# LiteLLM acts as an OpenAI-compatible gateway over all providers.
# AEGIS uses LiteLLM as an optional deployment mode where external tools
# (LangChain, Flowise, etc.) need an OpenAI-format endpoint.
#
# Start with:
#   litellm --config config/litellm_config.yaml --port 8080
#
# Or via docker-compose service "aegis-litellm".
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # Local providers (primary — zero cost)
  # ---------------------------------------------------------------------------

  - model_name: "default"
    litellm_params:
      model: "ollama/qwen2.5:14b"
      api_base: "${AEGIS_OLLAMA_BASE_URL:-http://localhost:11434}"

  - model_name: "ollama/qwen2.5:14b"
    litellm_params:
      model: "ollama/qwen2.5:14b"
      api_base: "${AEGIS_OLLAMA_BASE_URL:-http://localhost:11434}"

  - model_name: "ollama/qwen2.5-coder:14b"
    litellm_params:
      model: "ollama/qwen2.5-coder:14b"
      api_base: "${AEGIS_OLLAMA_BASE_URL:-http://localhost:11434}"

  - model_name: "ollama/llama3.2:3b"
    litellm_params:
      model: "ollama/llama3.2:3b"
      api_base: "${AEGIS_OLLAMA_BASE_URL:-http://localhost:11434}"

  - model_name: "ollama/phi4"
    litellm_params:
      model: "ollama/phi4"
      api_base: "${AEGIS_OLLAMA_BASE_URL:-http://localhost:11434}"

  # vLLM (optional — requires GPU server on :8001)
  - model_name: "vllm/qwen2.5-14b"
    litellm_params:
      model: "openai/Qwen/Qwen2.5-14B-Instruct"
      api_base: "${AEGIS_VLLM_BASE_URL:-http://localhost:8001}"
      api_key: "EMPTY"

  # ---------------------------------------------------------------------------
  # Cloud providers (free tier — only active when keys are set)
  # ---------------------------------------------------------------------------

  - model_name: "groq/llama-3.3-70b"
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: "${AEGIS_GROQ_API_KEY}"

  - model_name: "openrouter/mistral-small"
    litellm_params:
      model: "openrouter/mistralai/mistral-small-3"
      api_key: "${AEGIS_OPENROUTER_API_KEY}"

  - model_name: "gemini/flash"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "${AEGIS_GEMINI_API_KEY}"

  # ---------------------------------------------------------------------------
  # Embeddings
  # ---------------------------------------------------------------------------

  - model_name: "ollama/bge-m3"
    litellm_params:
      model: "ollama/bge-m3"
      api_base: "${AEGIS_OLLAMA_BASE_URL:-http://localhost:11434}"

# ---------------------------------------------------------------------------
# Router config — fallback chain
# ---------------------------------------------------------------------------

router_settings:
  routing_strategy: "fallback"
  fallbacks:
    - "ollama/qwen2.5:14b":
        - "groq/llama-3.3-70b"
        - "openrouter/mistral-small"
        - "gemini/flash"
  num_retries: 3
  timeout: 120
  retry_after: 5

# ---------------------------------------------------------------------------
# Server settings
# ---------------------------------------------------------------------------

litellm_settings:
  drop_params: true          # Silently drop unsupported params per provider
  request_timeout: 120
  success_callback: []
  failure_callback: []

general_settings:
  master_key: "${AEGIS_LITELLM_MASTER_KEY:-sk-litellm-dev-key-not-for-prod}"
  database_url: "${AEGIS_PG_DSN}"  # Optional: persist call logs to Postgres
  store_model_in_db: false
  allow_requests_on_db_fail: true
